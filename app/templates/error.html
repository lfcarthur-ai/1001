{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="card center">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('main.home') if current_user.is_authenticated else url_for('auth.login') }}">Voltar ao início</a></p>
</section>
{% endblock %}

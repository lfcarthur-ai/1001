{% extends "base.html" %}
{% block title %}Editar usuário{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin.index') }}">← Administração</a></p>
<section class="card narrow">
  <h1>Editar usuário</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome <input name="name" value="{{ user.name }}" required maxlength="80"></label>
    <label>E-mail <input type="email" name="email" value="{{ user.email }}" required></label>
    <fieldset><legend>Redefinir senha (opcional)</legend>
      <label>Nova senha <input type="password" name="password" minlength="8" autocomplete="new-password"></label>
      <label>Confirme <input type="password" name="password2" minlength="8" autocomplete="new-password"></label>
    </fieldset>
    <label class="check"><input type="checkbox" name="is_admin" value="1" {{ 'checked' if user.is_admin }}> Administrador</label>
    <label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if user.active }}> Conta ativa</label>
    <button class="btn primary" type="submit">Salvar</button>
  </form>
  {% if user.id != current_user.id %}
  <form method="post" action="{{ url_for('admin.delete_user', user_id=user.id) }}" onsubmit="return confirm('Excluir este usuário e todas as suas avaliações? Esta ação não pode ser desfeita.')">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn danger" type="submit">Excluir usuário</button>
  </form>
  {% endif %}
</section>
{% endblock %}

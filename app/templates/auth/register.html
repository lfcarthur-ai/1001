{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Criar conta</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome <input name="name" value="{{ form.name }}" required maxlength="80" autocomplete="name"></label>
    <label>E-mail <input type="email" name="email" value="{{ form.email }}" required autocomplete="email"></label>
    <label>Senha <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirme a senha <input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">Cadastrar</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>.</p>
</section>
{% endblock %}
